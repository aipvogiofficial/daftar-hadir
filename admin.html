<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin — Daftar Hadir</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="admin">

  <!-- ============ LOGIN ============ -->
  <main class="wrap" id="login-view" hidden>
    <div class="card narrow">
      <div class="head">
        <div class="label">ADMIN</div>
        <h1 class="app-name">Daftar Hadir</h1>
        <p>Masuk untuk mengelola kegiatan</p>
      </div>
      <form id="login-form">
        <label>Username<input name="username" required autocomplete="username"></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
        <div id="login-err" class="err" hidden></div>
        <button class="btn btn-primary btn-block" id="login-btn">Masuk</button>
      </form>
    </div>
  </main>

  <!-- ============ DASBOR ============ -->
  <div id="dash-view" hidden>
    <header class="topbar">
      <div class="brand"><span class="dot"></span><span class="app-name">Daftar Hadir</span></div>
      <nav class="tabs">
        <button data-tab="kegiatan" class="active">Kegiatan</button>
        <button data-tab="pengaturan">Pengaturan</button>
      </nav>
      <div class="user"><span id="user-nama"></span><button id="logout" class="btn-sm">Keluar</button></div>
    </header>

    <main class="wrap wide">
      <div id="toast" class="toast" hidden></div>

      <!-- Tab Kegiatan -->
      <section id="tab-kegiatan">
        <div class="card">
          <div class="card-title">
            <h2>Buat kegiatan baru</h2>
          </div>
          <form id="create-form" class="grid">
            <label class="full">Nama kegiatan <span class="req">*</span><input name="nama" required maxlength="200"></label>
            <label>Tanggal <span class="req">*</span><input name="tanggal" type="date" required></label>
            <label>Waktu<input name="waktu" placeholder="09.00–12.00 WITA"></label>
            <label>Tempat<input name="tempat" placeholder="Zoom Meeting / Aula …"></label>
            <label>Penyelenggara<input name="penyelenggara" value="AIPVOGI"></label>
            <label>Penanggung jawab (nama)<input name="pj_nama"></label>
            <label>Jabatan penanggung jawab<input name="pj_jabatan" placeholder="Ketua / Sekretaris …"></label>
            <div class="full"><button class="btn btn-primary" id="create-btn">Buat Kegiatan</button></div>
          </form>
        </div>

        <div class="card">
          <div class="card-title">
            <h2>Daftar kegiatan</h2>
            <button id="reload" class="btn-sm">↻ Muat ulang</button>
          </div>
          <div id="list"><p class="muted">Memuat…</p></div>
        </div>
      </section>

      <!-- Tab Pengaturan -->
      <section id="tab-pengaturan" hidden>
        <div class="card">
          <div class="card-title"><h2>Kop PDF daftar hadir</h2></div>
          <form id="set-form" class="grid">
            <label class="full">Nama organisasi<input name="org_nama" maxlength="300"></label>
            <label class="full">Baris kedua kop (alamat / sekretariat / email)<input name="org_sub" maxlength="300"></label>
            <label class="full">URL logo (PNG/JPG)<input name="logo_url" type="url" placeholder="https://…/assets/logo.png">
              <small>Paling mudah: unggah logo ke folder <code>assets</code> di repositori GitHub, lalu tempel alamat GitHub Pages-nya di sini.</small></label>
            <div class="full"><button class="btn btn-primary">Simpan Pengaturan</button></div>
          </form>
        </div>
        <div class="card">
          <div class="card-title"><h2>Ganti password</h2></div>
          <form id="pw-form" class="grid">
            <label>Password lama<input name="old" type="password" required autocomplete="current-password"></label>
            <label>Password baru (min. 8 karakter)<input name="new1" type="password" required minlength="8" autocomplete="new-password"></label>
            <label>Ulangi password baru<input name="new2" type="password" required minlength="8" autocomplete="new-password"></label>
            <div class="full"><button class="btn btn-primary">Ganti Password</button></div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- ============ MODAL ============ -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head"><h3 id="modal-title"></h3><button id="modal-close" class="btn-sm" aria-label="Tutup">✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="assets/common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
